name: CI

# Revisa cada cambio antes de que llegue a producción: que los tipos cuadren,
# que el sitio compile y que no entren dependencias con fallas críticas.
on:
  push:
    branches: [main]
  pull_request:

# Sin permisos de escritura: el flujo solo lee el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Compilar
        run: npm run build
      - name: Dependencias de producción sin fallas críticas
        run: npm audit --omit=dev --audit-level=critical
