name: CI

# Revisa cada cambio antes de que llegue a producción: que los tipos cuadren,
# que el sitio compile y que no entren dependencias con fallas críticas.
on:
  push:
    branches: [main]
  pull_request:

# Sin permisos de escritura: el flujo solo lee el código.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (TypeScript)
        run: npm run typecheck
      - name: Compilar
        run: npm run build
      # Después de compilar: algunas pruebas arrancan el sitio compilado (ver tests/integration/servidor-proxy.test.ts).
      - name: Pruebas automáticas
        run: npm test
        env:
          # Mongo desechable del propio flujo (ver "services"): las pruebas del webhook de Stripe lo usan y lo borran.
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017/stopee_test_ci
      - name: Dependencias de producción sin fallas altas ni críticas
        run: npm audit --omit=dev --audit-level=high
